# Runs the site and a Cloudflare Tunnel connector side by side on an internal-only
# bridge network. Nothing is published to the host: the tunnel reaches the site
# container directly over `webnet`, so no inbound port ever needs forwarding on the
# router. See DEPLOY.md for the one-time Cloudflare setup this depends on.
#
# Reads variables from a `.env` file next to this one (see .env.example): SITE_URL is
# passed through as a build arg (needed at build time by the static robots/sitemap
# routes); RESEND_API_KEY, CONTACT_TO_EMAIL and CONTACT_FROM_EMAIL are passed to the
# running container via env_file; TUNNEL_TOKEN configures the Cloudflare connector.

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_URL: ${SITE_URL}
    container_name: portfolio
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - webnet
    # Hardening: the filesystem is read-only apart from two in-memory scratch areas (Next's
    # cache and /tmp), every Linux capability is dropped, the process can never gain
    # privileges (setuid binaries do nothing), and memory and process counts are capped.
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:size=256m,uid=1001,gid=1001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256

  tunnel:
    # Pinned rather than `latest`, so an upstream release can't change what runs here
    # unannounced. To update: pick the newest tag on Docker Hub, then `docker compose up -d`.
    image: cloudflare/cloudflared:2026.9.3
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - webnet
    depends_on:
      - portfolio
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128

networks:
  webnet:
    driver: bridge
